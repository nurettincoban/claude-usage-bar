name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Stamp version
        run: plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" Resources/Info.plist
      - name: Build universal app
        run: UNIVERSAL=1 ./scripts/build-app.sh
      - name: Package
        run: |
          ditto -c -k --keepParent build/ClaudeBar.app "ClaudeBar-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "ClaudeBar-${GITHUB_REF_NAME}.zip" > "ClaudeBar-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ClaudeBar-*.zip* --title "ClaudeBar $GITHUB_REF_NAME" --generate-notes
